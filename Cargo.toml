[package]
name = "collate"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A fast, lightweight git diff viewer for macOS, built on Rune."

[dependencies]
# Only what a macOS app uses: VoiceOver and the Metal renderer. Rune's other defaults are
# Ogg audio, SVG images, Linux's D-Bus and fonts for the web.
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", default-features = false, features = ["accessibility", "metal-backend"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# The diff search's regular expressions.
regex = "1"
# The terminal drawer: a PTY and a VT parser and grid, as Alacritty itself runs them.
alacritty_terminal = { version = "0.26", default-features = false }
# Syntax colours for languages the built-in scanners don't know: grammars are fetched and
# compiled on demand (src/grammars.rs), so only the parser runtime ships in the app.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
# The type a compiled grammar's entry point is wrapped in to become a language.
tree-sitter-language = "0.1"
# Opens a compiled grammar.
libloading = "0.8"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
