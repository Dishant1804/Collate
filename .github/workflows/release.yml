name: Release

# Pushing a tag like v1.0.0 builds the downloads and publishes the release, its notes
# written from the commits since the tag before it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The Linux tarballs, built on the oldest supported Ubuntu so they run on its glibc and newer.
  linux:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libfontconfig-dev pkg-config poppler-utils
      - run: cargo test
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

      - run: cargo test

      # The Developer ID certificate goes into a keychain of its own on this runner, and the
      # notary key into a file; scripts/package.sh signs and notarizes with them.
      - name: Load the signing certificate and notary key
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          [ -n "$CERT_P12" ] && [ -n "$NOTARY_KEY_P8" ] || { echo "the signing secrets aren't set (MACOS_CERT_P12, NOTARY_KEY_P8)"; exit 1; }
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize the downloads
        env:
          COLLATE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [ -n "$COLLATE_SIGN_IDENTITY" ] || { echo "MACOS_SIGN_IDENTITY isn't set"; exit 1; }
          scripts/package.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: linux
          merge-multiple: true

      - name: Add the Linux downloads and sum them all
        run: |
          cp linux/*.tar.gz dist/
          rm dist/SHA256SUMS
          (cd dist && shasum -a 256 * > SHA256SUMS)
          cat dist/SHA256SUMS
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Collate ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

      # `brew install --cask dishant1804/tap/collate` installs the zip just published. The tap's
      # deploy key (HOMEBREW_TAP_KEY) may push to that repository and nothing else.
      - name: Update the Homebrew cask
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          [ -n "$TAP_KEY" ] || { echo "HOMEBREW_TAP_KEY isn't set"; exit 1; }
          version=${GITHUB_REF_NAME#v}
          sum=$(shasum -a 256 "dist/Collate-$version-macos-universal.zip" | cut -d' ' -f1)
          printf '%s\n' "$TAP_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:Dishant1804/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sum\"/" Casks/collate.rb
          grep -q "version \"$version\"" Casks/collate.rb && grep -q "sha256 \"$sum\"" Casks/collate.rb || { echo "couldn't set the cask's version and sha256"; exit 1; }
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -am "Collate $version"
          git push origin HEAD:main
